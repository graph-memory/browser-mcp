name: Publish browser-client to npm

# Triggered by tags of the form `client-vX.Y.Z` so client releases are
# disjoint from server tags (`vX.Y.Z`, handled by publish.yml). Manual
# dispatch is available for re-runs.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # setup-node caches by default since v5; a release build must not
          # restore anything it did not produce itself.
          package-manager-cache: false

      # registry-url makes setup-node write `_authToken=${NODE_AUTH_TOKEN}`
      # into the runner's .npmrc unconditionally. With no token in the
      # environment that line still reads as configured auth, so npm can send
      # an empty credential instead of the one it gets over OIDC. Drop the
      # line and keep the registry pin.
      - run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      # --ignore-scripts skips the root postinstall (`npx playwright install
      # chromium`) — the client doesn't need Chromium, so we save ~minutes
      # and a few hundred MB.
      - run: npm ci --ignore-scripts

      # Gate the release on the client's own test suite (mocked fetch, fast).
      - run: npm run build -w @graphmemory/browser-client
      - run: npm test  -w @graphmemory/browser-client

      # `npm publish` triggers the package's `prepack` script (cp LICENSE) and
      # `prepublishOnly` (build again, no-op cache hit) before the tarball is
      # assembled.
      #
      # Trusted publishing (OIDC): no NODE_AUTH_TOKEN, and npm attaches
      # provenance on its own, so --provenance is redundant. --access public
      # is gone too: it only matters for the first publish of a scoped
      # package, and since 2026-07-31 npm treats setting package access as a
      # management operation that a token cannot perform unattended.
      # The trusted publisher on npmjs.com is pinned to this filename —
      # renaming the file breaks the release until the config is updated.
      - run: npm publish -w @graphmemory/browser-client
